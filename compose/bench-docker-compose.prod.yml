services:
  bench-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

  bench-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - bench-postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - bench-network

  bench-celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A bootcamp worker -l info
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

  bench-celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A bootcamp beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

volumes:
  bench-postgres-data:

networks:
  bench-network:
    driver: bridge
