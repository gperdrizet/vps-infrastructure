services:
  bench-web:
    image: bench-web
    container_name: bench-web
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

  bench-postgres:
    image: postgres:16-alpine
    container_name: bench-postgres
    restart: unless-stopped
    volumes:
      - bench-postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-redis:
    image: redis:7-alpine
    container_name: bench-redis
    restart: unless-stopped
    networks:
      - bench-network

  bench-celery:
    image: bench-celery
    container_name: bench-celery
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A bootcamp worker -l info
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

  bench-celery-beat:
    image: bench-celery-beat
    container_name: bench-celery-beat
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A bootcamp beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      bench-postgres:
        condition: service_healthy
      bench-redis:
        condition: service_started
    networks:
      - bench-network

  bench-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: bench-postgres-exporter
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATA_SOURCE_NAME: "postgresql://bench:AzCHy9Zrt9-rQx84YaA0@bench-postgres:5432/bench?sslmode=disable"
    ports:
      - "127.0.0.1:9188:9187"
    depends_on:
      bench-postgres:
        condition: service_healthy
    networks:
      - bench-network

volumes:
  bench-postgres-data:
    external: true
    name: docker_bench-postgres-data

networks:
  bench-network:
    driver: bridge
