version: '3.8'

# Independent Monitoring Stack
# Separated from application services for reliability

networks:
  monitoring-network:
    name: monitoring-network
    driver: bridge
  logkeep-network:
    name: logkeep_logkeep-network
    external: true
  bench-network:
    name: bench_bench-network
    external: true

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - /srv/infra/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/infra/configs/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - /srv/infra/data/monitoring/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network
      - logkeep-network
      - bench-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}
    volumes:
      - /srv/infra/data/monitoring/grafana:/var/lib/grafana
      - /srv/infra/configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - /srv/infra/configs/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - prometheus
      - loki

  alertmanager:
    image: prom/alertmanager:latest
    container_name: monitoring-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - /srv/infra/configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/infra/data/monitoring/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  loki:
    image: grafana/loki:latest
    container_name: monitoring-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - /srv/infra/configs/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /srv/infra/data/monitoring/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  promtail:
    image: grafana/promtail:latest
    container_name: monitoring-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /srv/infra/configs/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - loki

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: monitoring-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - /srv/infra/configs/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: monitoring-nginx-exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://host.docker.internal/nginx_status'
    ports:
      - "127.0.0.1:9113:9113"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    devices:
      - /dev/kmsg
