user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
	multi_accept on;
        use epoll;
}

stream {
    # Logging for TCP connections
    log_format stream_log '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time';

    access_log /var/log/nginx/stream_access.log stream_log;
    error_log /var/log/nginx/stream_error.log;

    # Rate limiting: track connections per IP (10MB zone = ~160,000 IPs)
    limit_conn_zone $binary_remote_addr zone=postgres_conn:10m;

    # PostgreSQL upstream (via WireGuard tunnel to local machine)
    upstream postgresql_backend {
        server 100.64.0.2:5432;
        
        # Keep connections alive to reduce handshake overhead
        # (requires nginx 1.15.3+)
    }

    # PostgreSQL TCP proxy
    server {
        listen 54321;
        proxy_pass postgresql_backend;
        
        # Timeout settings
        proxy_timeout 600s;           # Allow long-running queries (10 min)
        proxy_connect_timeout 30s;    # Connection establishment timeout
        
        # Buffer settings for better throughput
        proxy_buffer_size 16k;
        
        # Limit to 5 concurrent connections per IP
        # 30 students × 3 connections each = 90 max, plus buffer
        # Individual student limit prevents one person hogging resources
        limit_conn postgres_conn 5;
    }
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	# Rate limiting zones
	limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
	limit_req_zone $binary_remote_addr zone=llm:10m rate=12r/m;  # LLM: max 12 requests/min per IP
	limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

	# Request size limits
	client_max_body_size 10M;
	client_body_buffer_size 128k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 8k;

	# Timeout hardening (prevents slowloris)
	client_body_timeout 12;
	client_header_timeout 12;
	keepalive_timeout 15;
	send_timeout 10;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
}


