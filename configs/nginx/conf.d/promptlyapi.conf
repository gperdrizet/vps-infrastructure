# Promptly API Gateway
# Domain: promptlyapi.com
# Proxies to model-gateway container on localhost

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name promptlyapi.com www.promptlyapi.com;

    if ($host = www.promptlyapi.com) {
        return 301 https://promptlyapi.com$request_uri;
    }

    if ($host = promptlyapi.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name promptlyapi.com www.promptlyapi.com;
    include snippets/security-headers.conf;

    ssl_certificate /etc/letsencrypt/live/promptlyapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promptlyapi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    access_log /var/log/nginx/promptlyapi-access.log;
    error_log /var/log/nginx/promptlyapi-error.log;

    # www -> apex redirect
    if ($host = www.promptlyapi.com) {
        return 301 https://promptlyapi.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
