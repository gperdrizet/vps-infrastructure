# OpenVSCode Server - Remote Development on pyrite
# Domain: code.perdrizet.org
# Backend: pyrite via autossh reverse tunnel on 127.0.0.1:47301
#
# Authentication: nginx auth_basic (openvscode-server has no built-in auth)
# Create credentials with:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-code <username>

# HTTP to HTTPS redirect
server {
    if ($host = code.perdrizet.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name code.perdrizet.org;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code.perdrizet.org;

    # SSL Configuration - Ionos Wildcard Certificate
    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem; # managed by Certbot

    # SSL Protocols and Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers (omit X-Frame-Options: DENY - VS Code uses iframes internally)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/code-access.log;
    error_log /var/log/nginx/code-error.log;

    # Authentication - required because openvscode-server has no built-in auth
    auth_basic "VS Code - pyrite";
    auth_basic_user_file /etc/nginx/.htpasswd-code;

    # Proxy to openvscode-server via autossh reverse tunnel
    location / {
        proxy_pass http://127.0.0.1:47301;
        proxy_http_version 1.1;

        # WebSocket support (required for terminal, live reload, extensions)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Long timeouts for interactive dev sessions
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Larger buffers for extension downloads
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }
}
