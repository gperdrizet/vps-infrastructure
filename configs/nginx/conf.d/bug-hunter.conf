# Bug Hunter proxy
# Domain: bug-hunter.perdrizet.org
# Proxies to bug-hunter frontend container on localhost

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name bug-hunter.perdrizet.org;
    include snippets/security-headers.conf;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bug-hunter.perdrizet.org;
    include snippets/security-headers.conf;

    ssl_certificate /etc/letsencrypt/live/bug-hunter.perdrizet.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bug-hunter.perdrizet.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:BugHunterSSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/bug-hunter-access.log;
    error_log /var/log/nginx/bug-hunter-error.log;

    location / {
        proxy_pass http://127.0.0.1:8509;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
