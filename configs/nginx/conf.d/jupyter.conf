# JupyterLab Server - Remote Notebooks on pyrite
# Domain: jupyter.perdrizet.org
# Backend: pyrite via autossh reverse tunnel on 127.0.0.1:47302
#
# Authentication: JupyterLab's built-in password auth (set with `jupyter server password`)

# HTTP to HTTPS redirect
server {
    if ($host = jupyter.perdrizet.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name jupyter.perdrizet.org;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jupyter.perdrizet.org;

    # SSL Configuration - Ionos Wildcard Certificate
    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem; # managed by Certbot

    # SSL Protocols and Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/jupyter-access.log;
    error_log /var/log/nginx/jupyter-error.log;

    # Proxy to JupyterLab via autossh reverse tunnel
    location / {
        proxy_pass http://127.0.0.1:47302;
        proxy_http_version 1.1;

        # WebSocket support (required for kernel communication)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long timeouts for long-running kernel operations
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
