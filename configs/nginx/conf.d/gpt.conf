# GPT-OSS-120B API proxy
# Domain: gpt.perdrizet.org
# Proxies to llama-server on the local machine via WireGuard tunnel

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name gpt.perdrizet.org;
    include snippets/security-headers.conf;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gpt.perdrizet.org;
    include snippets/security-headers.conf;

    # SSL Configuration - Ionos Wildcard Certificate
    ssl_certificate /etc/nginx/certs/perdrizet.org_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/perdrizet.org_starter_wildcard.key;

    # SSL Protocols and Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:GptSSL:10m;
    ssl_session_tickets off;

    # Security Headers

    # Logging
    access_log /var/log/nginx/gpt-access.log;
    error_log /var/log/nginx/gpt-error.log;

    # Proxy to llama-server via WireGuard tunnel
    location / {
        proxy_pass http://10.0.0.2:8502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # Long timeouts - LLM generation can take minutes on large prompts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }
}
