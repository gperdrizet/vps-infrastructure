# Prometheus Configuration for LogKeep
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'logkeep-production'
    environment: 'production'

# Alertmanager configuration for email alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['monitoring-alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['monitoring-node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'vps-primary'

  # LogKeep PostgreSQL Exporter
  - job_name: 'logkeep-postgres-exporter'
    static_configs:
      - targets: ['logkeep-postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'logkeep'

  # Bench PostgreSQL Exporter
  - job_name: 'bench-postgres-exporter'
    static_configs:
      - targets: ['bench-postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'bench'

  # LogKeep Application (Blue)
  - job_name: 'logkeep-blue'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-blue:8000']
        labels:
          service: 'logkeep'
          slot: 'blue'
          environment: 'production'

  # LogKeep Application (Green)
  - job_name: 'logkeep-green'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-green:8000']
        labels:
          service: 'logkeep'
          slot: 'green'
          environment: 'production'

  # LogKeep Staging
  - job_name: 'logkeep-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-staging:8000']
        labels:
          service: 'logkeep'
          slot: 'staging'
          environment: 'staging'

  # Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring-cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'vps-primary'

  # Nginx Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['monitoring-nginx-exporter:9113']
        labels:
          service: 'nginx'
          instance: 'vps-primary'

  # Headscale metrics
  - job_name: 'headscale'
    static_configs:
      - targets: ['host.docker.internal:9099']
        labels:
          service: 'headscale'
          instance: 'vps-primary'

  # SSL Certificate Monitoring - sites that return 2xx
  - job_name: 'ssl-certs'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://bench.perdrizet.org
          - https://logkeep.perdrizet.org
          - https://grafana.perdrizet.org
          - https://headplane.perdrizet.org
          - https://jupyter.perdrizet.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115

  # SSL Certificate Monitoring - sites with non-2xx responses (auth/API roots)
  - job_name: 'ssl-certs-reachable'
    metrics_path: /probe
    params:
      module: [http_reachable]
    static_configs:
      - targets:
          - https://headscale.perdrizet.org
          - https://code.perdrizet.org
          - https://model.perdrizet.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115
